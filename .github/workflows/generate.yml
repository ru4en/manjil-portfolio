name: Generate CV & Cover Letter

on:
  workflow_dispatch:
    inputs:
      job_title:
        description: "Job title (e.g. Video Editor)"
        required: true
        type: string
        default: "Video Editor"
      company:
        description: "Company name"
        required: true
        type: string
        default: "Example Company"
      job_type:
        description: "Optional job type"
        required: false
        type: choice
        options:
          - ""
          - contract
          - full-time
          - internship
      focus:
        description: "Content focus (auto detects from job title if left as auto)"
        required: true
        type: choice
        options:
          - auto
          - editor
          - sound
          - director
          - general
        default: auto
      technical_skills:
        description: "★ PASTE technical skills from the job description (leave blank to use FOCUS preset). Example: Adobe Premiere Pro, DaVinci Resolve, colour grading, Avid Media Composer"
        required: false
        type: string
        default: ""
      professional_skills:
        description: "★ PASTE professional/soft skills from the job description (leave blank to use FOCUS preset). Example: Working to deadlines, collaboration, attention to detail"
        required: false
        type: string
        default: ""
      profile:
        description: "Optional full Personal Profile paragraph (leave blank to use FOCUS preset)"
        required: false
        type: string
        default: ""
      include_phone:
        description: "Include phone number on CV & CL"
        required: true
        type: boolean
        default: true
      host_on_github:
        description: "Deploy generated pack to GitHub Pages"
        required: true
        type: boolean
        default: false
      cv_only:
        description: "Generate CV only (skip cover letter)"
        required: true
        type: boolean
        default: false

# Permissions needed for Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal + required packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern \
            make

      - name: Prepare parameters
        id: params
        run: |
          echo "JOB_TITLE=${{ inputs.job_title }}" >> $GITHUB_ENV
          echo "COMPANY=${{ inputs.company }}" >> $GITHUB_ENV
          echo "JOB_TYPE=${{ inputs.job_type }}" >> $GITHUB_ENV
          echo "FOCUS=${{ inputs.focus }}" >> $GITHUB_ENV
          echo "INCLUDE_PHONE=${{ inputs.include_phone }}" >> $GITHUB_ENV
          echo "CV_ONLY=${{ inputs.cv_only }}" >> $GITHUB_ENV

          # Only set skill/profile overrides when the user actually pasted something
          if [ -n "${{ inputs.technical_skills }}" ]; then
            echo "TECHNICAL_SKILLS=${{ inputs.technical_skills }}" >> $GITHUB_ENV
            echo "Using pasted TECHNICAL_SKILLS"
          fi
          if [ -n "${{ inputs.professional_skills }}" ]; then
            echo "PROFESSIONAL_SKILLS=${{ inputs.professional_skills }}" >> $GITHUB_ENV
            echo "Using pasted PROFESSIONAL_SKILLS"
          fi
          if [ -n "${{ inputs.profile }}" ]; then
            echo "PROFILE=${{ inputs.profile }}" >> $GITHUB_ENV
            echo "Using pasted PROFILE"
          fi

          # Fixed personal details (edit here or move to secrets if preferred)
          echo "NAME=Manjil Sahani" >> $GITHUB_ENV
          echo "LOCATION=Swindon, United Kingdom" >> $GITHUB_ENV
          echo "PHONE=+44 00000000000" >> $GITHUB_ENV
          echo "EMAIL=sahanimanjil17@outlook.com" >> $GITHUB_ENV
          echo "PORTFOLIO=https://manjilfr.wixsite.com/portfolio" >> $GITHUB_ENV
          echo "LINKEDIN=https://www.linkedin.com/in/manjil-sahani-0317a624" >> $GITHUB_ENV

      - name: Build (same targets as local Makefile)
        run: |
          # Build the make argument list dynamically so empty skills don't wipe presets
          ARGS=(
            JOB_TITLE="$JOB_TITLE"
            COMPANY="$COMPANY"
            JOB_TYPE="$JOB_TYPE"
            FOCUS="$FOCUS"
            INCLUDE_PHONE="$INCLUDE_PHONE"
            CV_ONLY="$CV_ONLY"
            NAME="$NAME"
            LOCATION="$LOCATION"
            PHONE="$PHONE"
            EMAIL="$EMAIL"
            PORTFOLIO="$PORTFOLIO"
            LINKEDIN="$LINKEDIN"
          )
          if [ -n "${TECHNICAL_SKILLS:-}" ]; then
            ARGS+=(TECHNICAL_SKILLS="$TECHNICAL_SKILLS")
          fi
          if [ -n "${PROFESSIONAL_SKILLS:-}" ]; then
            ARGS+=(PROFESSIONAL_SKILLS="$PROFESSIONAL_SKILLS")
          fi
          if [ -n "${PROFILE:-}" ]; then
            ARGS+=(PROFILE="$PROFILE")
          fi
          make all "${ARGS[@]}"

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: application-pack
          path: build/
          retention-days: 14

      # ---------- Optional: GitHub Pages ----------
      - name: Setup Pages
        if: ${{ inputs.host_on_github }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.host_on_github }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    if: ${{ inputs.host_on_github }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
